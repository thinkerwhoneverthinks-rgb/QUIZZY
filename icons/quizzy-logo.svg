<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Quizzy">
  <defs>
    <linearGradient id="qz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ec9d6"/>
      <stop offset="1" stop-color="#17a673"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#qz)" stroke-linecap="round">
    <!-- Q ring -->
    <circle cx="230" cy="230" r="150" stroke-width="56"/>
    <!-- Q tail -->
    <path d="M330 330 L400 400" stroke-width="56"/>
    <!-- smile -->
    <path d="M182 262 q48 52 96 0" stroke-width="24"/>
  </g>
  <!-- eyes -->
  <circle cx="194" cy="194" r="17" fill="url(#qz)"/>
  <circle cx="266" cy="194" r="17" fill="url(#qz)"/>
</svg>
